name: Test

on:
  push:
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax
        run: npm run test:syntax

      - name: Unit and editor checks
        run: npm test

      - name: Smoke reports
        run: npm run test:smoke
